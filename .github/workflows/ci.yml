name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check gwyl_mail tests
      - name: Black
        run: black --check gwyl_mail tests
      - name: Mypy
        run: mypy gwyl_mail

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Run tests
        run: |
          pytest -q

  test-with-ots:
    # Sanity check: the suite stays green when the 'ots' binary IS present
    # (tests monkeypatch subprocess, but import paths must not collide).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps + ots
        run: |
          python -m pip install -U pip
          pip install -e .[dev] opentimestamps-client
      - name: Run tests
        run: |
          pytest -q
