[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwyl-mail"
version = "0.1.0"
description = "Privacy Infrastructure Layer pour Email - Intégrité cryptographique et timestamping"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}
authors = [
    {name = "Zack", email = "zack@gwyl.io"},
]
maintainers = [
    {name = "Claude", email = "claude@anthropic.com"},
    {name = "ChatGPT", email = "chatgpt@openai.com"},
]
keywords = [
    "email",
    "privacy",
    "cryptography",
    "timestamping",
    "sigstore",
    "opentimestamps",
    "integrity",
    "non-repudiation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "sigstore>=2.0.0",
    "cryptography>=41.0.0",
    "opentimestamps-client>=0.7.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/gwyl/gwyl-mail"
Documentation = "https://github.com/gwyl/gwyl-mail/tree/main/docs"
Repository = "https://github.com/gwyl/gwyl-mail"
Issues = "https://github.com/gwyl/gwyl-mail/issues"

[project.scripts]
gwyl-mail = "gwyl_mail.cli:main"

[tool.setuptools]
packages = ["gwyl_mail"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=gwyl_mail --cov-report=html --cov-report=term"
